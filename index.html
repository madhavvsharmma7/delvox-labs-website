    <meta name="theme-color" id="theme-color" content="#F4F6F3" />
    <link rel="canonical" href="https://delvoxlabs.vercel.app/" />
    <title>Delvox Labs · Never Miss a Customer Call Again | AI Receptionist</title>

    <!-- Set theme before first paint: localStorage wins, then system preference -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('delvox-theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
          var meta = document.getElementById('theme-color');
          if (meta) meta.setAttribute('content', dark ? '#0C1712' : '#F4F6F3');
        } catch (e) {}
      })();
    </script>

    <!-- Structured data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Delvox Labs",
      "url": "https://delvoxlabs.vercel.app/",

    <!-- Structured data: FAQ (answer-first, for AI search / rich results) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        { "@type": "Question", "name": "How does Delvox answer calls I miss?", "acceptedAnswer": { "@type": "Answer", "text": "When a call goes unanswered, Delvox's AI responds within seconds. It texts the caller back on WhatsApp, answers their questions, and captures their details as a lead. If they want an appointment, it books one." } },
        { "@type": "Question", "name": "Do I need a new phone number or hardware?", "acceptedAnswer": { "@type": "Answer", "text": "No. Delvox works with your existing business number. Setup happens remotely. There is nothing to install at your shop or clinic." } },
        { "@type": "Question", "name": "What happens after the 14-day free trial?", "acceptedAnswer": { "@type": "Answer", "text": "If it's working for you, you pick a plan and the monthly subscription plus a one-time setup fee begins. If not, you walk away. No card is required for the trial, so there is nothing to cancel." } },
        { "@type": "Question", "name": "Does it speak Hindi or my customers' language?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Delvox handles conversations in English, Hindi, and other Indian languages, so customers can reply in whatever language they are comfortable with." } },
        { "@type": "Question", "name": "Who owns the leads and the data?", "acceptedAnswer": { "@type": "Answer", "text": "You do. Every lead, message, and conversation belongs to your business. If you ever leave, your data goes with you." } },
        { "@type": "Question", "name": "How long does setup take?", "acceptedAnswer": { "@type": "Answer", "text": "Most businesses are live within a few days. We configure the AI around your services, hours, and common questions, test it with you, and switch it on." } }
      ]
    }
    </script>
