    <!-- Structured data: FAQ (answer-first, for AI search / rich results) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        { "@type": "Question", "name": "How much does a project cost?", "acceptedAnswer": { "@type": "Answer", "text": "Every project is quoted upfront before any work starts — one fixed price for the whole build, no hidden fees and no retainers. The number depends on scope, and we settle it in the first conversation so there are no surprises." } },
        { "@type": "Question", "name": "How long does it take?", "acceptedAnswer": { "@type": "Answer", "text": "Most builds ship in days to two weeks. FixIt Plumbers went from first conversation to a live, indexed site in six days. The timeline is agreed before starting, and you get a staging link at every milestone." } },
        { "@type": "Question", "name": "Do I own everything when it's done?", "acceptedAnswer": { "@type": "Answer", "text": "Yes, completely. All the code lives on your GitHub and your accounts from day one. No lock-in and nothing held hostage." } },
        { "@type": "Question", "name": "I'm not technical. Is that a problem?", "acceptedAnswer": { "@type": "Answer", "text": "Not at all. You get plain-language updates, a staging link to click through at each milestone, and a full walkthrough at handoff. You never have to touch code or jargon." } },
        { "@type": "Question", "name": "What happens if something breaks after launch?", "acceptedAnswer": { "@type": "Answer", "text": "Every build includes two weeks of post-launch support, so I stay reachable to fix anything that comes up. After that I'm still an email away for changes." } },
        { "@type": "Question", "name": "Is this just AI and templates?", "acceptedAnswer": { "@type": "Answer", "text": "No. Every site is a custom React build written for your business, not a template or page builder. AI is a tool I use to ship faster and smarter; it is not the product." } }
      ]
    }
