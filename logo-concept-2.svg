<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!--
    CONCEPT 2 — ">D_"  (Terminal Prompt)
    The site already uses ">_" in the navbar. This evolves it into
    a proper monogram: chevron (blue gradient) + D (white) + cursor (cyan).
    Reads as ">D_" — a command prompt with the brand initial.
  -->

  <defs>
    <!-- Blue → cyan gradient for the chevron, top to bottom -->
    <linearGradient id="chevGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded-square background -->
  <rect width="200" height="200" rx="44" fill="#080C14"/>

  <!--
    ">" chevron — two strokes meeting at vertex (82, 100).
    Spans from y = 52 to y = 148 (96 px tall).
    Vertex at x = 82 gives equal visual weight with the D beside it.
  -->
  <polyline
    points="38,52 82,100 38,148"
    fill="none"
    stroke="url(#chevGrad)"
    stroke-width="15"
    stroke-linejoin="miter"
    stroke-linecap="round"
  />

  <!--
    D letterform — white, fill-rule evenodd counter.

    Outer:  bar x 100–118, arc from (118, 52) → (118, 148), r = 48
            center (118, 100), rightmost x = 166
    Inner:  arc from (118, 70) → (118, 130), r = 30
            center (118, 100), rightmost x = 148

    Stroke weight: bar 18 px = caps 18 px = right wall 18 px
  -->
  <path
    fill-rule="evenodd"
    fill="#F8FAFC"
    d="
      M 100 52
      L 118 52
      A 48 48 0 0 1 118 148
      L 100 148
      Z

      M 118 70
      A 30 30 0 0 1 118 130
      Z
    "
  />

  <!--
    "_" cursor — cyan, sits flush after the D's right extent.
    Positioned at the same baseline as the inner-bottom of the D (y ≈ 130).
  -->
  <rect x="168" y="128" width="18" height="7" rx="3.5" fill="#38BDF8"/>

</svg>
