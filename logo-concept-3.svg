<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!--
    CONCEPT 3 — "Hex Circuit D"
    A regular hexagon border (blue) frames the D.
    Cyan dots at each vertex reference circuit-board pads.
    Works well at header scale; complex detail disappears gracefully at favicon size.
  -->

  <defs>
    <!-- Subtle radial glow behind the D, contained within the hex -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#2563EB" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark rounded-square background -->
  <rect width="200" height="200" rx="44" fill="#080C14"/>

  <!--
    Regular hexagon — pointy-top orientation, centered at (100, 100).
    Circumradius R = 82.
    Vertices (rounded to 1 dp):
      top          (100.0,  18.0)
      top-right    (171.0,  59.0)
      bottom-right (171.0, 141.0)
      bottom       (100.0, 182.0)
      bottom-left   (29.0, 141.0)
      top-left      (29.0,  59.0)
  -->
  <polygon
    points="100,18 171,59 171,141 100,182 29,141 29,59"
    fill="url(#glowGrad)"
    stroke="#2563EB"
    stroke-width="5"
    stroke-linejoin="round"
  />

  <!-- Circuit-pad dots at each vertex -->
  <circle cx="100" cy="18"  r="4.5" fill="#38BDF8"/>
  <circle cx="171" cy="59"  r="4.5" fill="#38BDF8"/>
  <circle cx="171" cy="141" r="4.5" fill="#38BDF8"/>
  <circle cx="100" cy="182" r="4.5" fill="#38BDF8"/>
  <circle cx="29"  cy="141" r="4.5" fill="#38BDF8"/>
  <circle cx="29"  cy="59"  r="4.5" fill="#38BDF8"/>

  <!--
    Short circuit-trace lines extending inward from the top-right
    and bottom-right vertices toward the D — adds depth without clutter.
  -->
  <line x1="171" y1="59"  x2="148" y2="72"  stroke="#2563EB" stroke-width="2" opacity="0.5"/>
  <line x1="171" y1="141" x2="148" y2="128" stroke="#2563EB" stroke-width="2" opacity="0.5"/>

  <!--
    D letterform centered inside the hexagon — white, fill-rule evenodd.

    Outer: bar x 62–84, arc from (84, 48) → (84, 152), r = 52
           center (84, 100), rightmost x = 136
    Inner: arc from (84, 70) → (84, 130), r = 30
           center (84, 100), rightmost x = 114

    Center of D: (62 + 136) / 2 = 99 ≈ 100 (canvas centre) ✓
    Stroke weight: bar 22 px = caps 22 px = right wall 22 px
  -->
  <path
    fill-rule="evenodd"
    fill="#F8FAFC"
    d="
      M 62 48
      L 84 48
      A 52 52 0 0 1 84 152
      L 62 152
      Z

      M 84 70
      A 30 30 0 0 1 84 130
      Z
    "
  />

</svg>
